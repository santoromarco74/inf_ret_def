<text x="714" y="705.0" text-anchor="start" font-size="11" fill="#222">J = 4/15 = 0,27 ≥ 0,2 ✓</text>
<text x="714" y="721.0" text-anchor="start" font-size="11" fill="#e08a1e" font-weight="bold">Levenshtein d = 5 &gt; 2 ✗  →  scartato</text>
<text x="20" y="758" text-anchor="start" font-size="10.5" fill="#444">«frigitrice» non è nel dizionario: senza fuzzy la ricerca dà 0 righe; con la modalità FALLBACK usa i termini accettati (friggitrice, friggitrici) e trova 14 righe.</text>
<text x="20" y="774" text-anchor="start" font-size="10.5" fill="#444">Dati reali dal corpus (data/corpus.tsv, 1067 righe, testo = codice + descrizione). Jaccard = trigrammi in comune / trigrammi distinti dei due termini.</text>
