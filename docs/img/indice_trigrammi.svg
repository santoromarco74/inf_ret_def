<text x="34" y="290" text-anchor="start" font-size="11" fill="#222" font-weight="bold">Controllo di ogni candidato col pattern «*trice» (funzione corrisponde, senza regex):  friggitrice ✓  lavatrice ✓  →  2 termini</text>
<text x="34" y="305" text-anchor="start" font-size="9.5" fill="#444">i trigrammi garantiscono che i pezzi ci sono, non che siano contigui e al posto giusto: qui il controllo non scarta nessuno dei 2 candidati. Le righe del risultato sono quelle che contengono almeno uno dei due termini.</text>
